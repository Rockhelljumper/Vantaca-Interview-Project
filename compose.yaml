name: vantaca-northwind-integration

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Local_Demo_SQL_2026!}"
    ports:
      - "${MSSQL_HOST_PORT:-14330}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" -b -o /dev/null',
        ]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 20
    restart: unless-stopped
    stop_grace_period: 20s

  northwind-mock:
    build:
      context: ./Demo/mock/northwind
      dockerfile: Dockerfile
    image: vantaca-northwind-mock:local
    init: true
    environment:
      NORTHWIND_MOCK_PORT: "8081"
      NORTHWIND_MOCK_API_KEY: "${NORTHWIND_MOCK_API_KEY:-northwind_mock_local_key}"
      NORTHWIND_MOCK_WEBHOOK_URL: "http://vantaca-api:8080/api/webhooks/northwind"
      NORTHWIND_MOCK_WEBHOOK_ATTEMPTS: "${NORTHWIND_MOCK_WEBHOOK_ATTEMPTS:-3}"
      NORTHWIND_MOCK_WEBHOOK_BACKOFF: "${NORTHWIND_MOCK_WEBHOOK_BACKOFF:-100ms}"
      NORTHWIND_MOCK_SCENARIO_DELAY: "${NORTHWIND_MOCK_SCENARIO_DELAY:-5s}"
      SWAGGER_UI_ORIGIN: "http://localhost:${SWAGGER_UI_HOST_PORT:-18090}"
    ports:
      - "${NORTHWIND_MOCK_HOST_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "/northwind-mock", "healthcheck"]
      interval: 5s
      timeout: 3s
      start_period: 3s
      retries: 10
    restart: unless-stopped
    stop_grace_period: 10s

  vantaca-api:
    build:
      context: ./Demo
      dockerfile: api/Dockerfile
    image: vantaca-northwind-api:local
    init: true
    environment:
      API_PORT: "8080"
      DB_HOST: "sqlserver"
      DB_PORT: "1433"
      DB_USER: "sa"
      DB_PASSWORD: "${MSSQL_SA_PASSWORD:-Local_Demo_SQL_2026!}"
      DB_NAME: "${MSSQL_DATABASE:-VantacaNorthwindDemo}"
      MIGRATIONS_DIR: "/app/database/migrations"
      SEEDS_DIR: "/app/database/seeds"
      NORTHWIND_BASE_URL: "http://northwind-mock:8081/v1"
      NORTHWIND_API_KEY: "${NORTHWIND_MOCK_API_KEY:-northwind_mock_local_key}"
      NORTHWIND_TIMEOUT: "${NORTHWIND_TIMEOUT:-2s}"
      FRESHNESS_THRESHOLD: "${FRESHNESS_THRESHOLD:-5m}"
      DEMO_TENANT_ID: "tenant_demo"
      DEMO_CUSTOMER_ID: "customer_demo"
      DEMO_LINK_ID: "11111111-1111-4111-8111-111111111111"
      DEMO_CONTROLS_ENABLED: "true"
      DEMO_ALLOW_UNSIGNED_WEBHOOKS: "true"
      DEMO_ADMIN_KEY: "${DEMO_ADMIN_KEY:-demo_admin_local_only}"
      SWAGGER_UI_ORIGIN: "http://localhost:${SWAGGER_UI_HOST_PORT:-18090}"
    ports:
      - "${VANTACA_API_HOST_PORT:-18080}:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      northwind-mock:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/vantaca-api", "healthcheck"]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 15
    restart: unless-stopped
    stop_grace_period: 15s

  web:
    build:
      context: ./Demo/web
      dockerfile: Dockerfile
    image: vantaca-northwind-web:local
    init: true
    environment:
      API_INTERNAL_URL: "http://vantaca-api:8080"
    ports:
      - "${WEB_HOST_PORT:-13000}:3000"
    depends_on:
      vantaca-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 15
    restart: unless-stopped
    stop_grace_period: 10s

  swagger-ui:
    image: swaggerapi/swagger-ui:v5.32.11
    environment:
      URLS: >-
        [{"url":"/specs/vantaca-demo-openapi.yaml","name":"Vantaca Demo API"},{"url":"/specs/northwind-mock-openapi.yaml","name":"Northwind Mock API"}]
      URLS_PRIMARY_NAME: "Vantaca Demo API"
      DEEP_LINKING: "true"
      DISPLAY_REQUEST_DURATION: "true"
      TRY_IT_OUT_ENABLED: "true"
    ports:
      - "${SWAGGER_UI_HOST_PORT:-18090}:8080"
    volumes:
      - ./Demo/api/internal/httpapi/openapi.yaml:/usr/share/nginx/html/specs/vantaca-demo-openapi.yaml:ro
      - ./Demo/mock/northwind/internal/mockapi/openapi.yaml:/usr/share/nginx/html/specs/northwind-mock-openapi.yaml:ro
    depends_on:
      vantaca-api:
        condition: service_healthy
      northwind-mock:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 15
    restart: unless-stopped
    stop_grace_period: 10s

  n8n:
    image: n8nio/n8n:2.34.6
    profiles: ["automation"]
    environment:
      N8N_HOST: "0.0.0.0"
      N8N_PORT: "5678"
      N8N_PROTOCOL: "http"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      DEMO_ADMIN_KEY: "${DEMO_ADMIN_KEY:-demo_admin_local_only}"
    ports:
      - "${N8N_HOST_PORT:-5678}:5678"
    volumes:
      - n8n-data:/home/node/.n8n
      - ./Demo/automation/n8n:/workflows:ro
    depends_on:
      vantaca-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sqlserver-data:
  n8n-data:
